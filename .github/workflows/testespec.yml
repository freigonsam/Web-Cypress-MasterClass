name: Run Ci Testes-Cypress

on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Clone do Projeto
        uses: actions/checkout@v6.1.0

      - name: Instalando deps do proejto
        run: npm install

      - name: Executando testes 
        run: npx cypress run
